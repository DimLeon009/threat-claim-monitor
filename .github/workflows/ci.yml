name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: find scripts infra -type f -name '*.sh' -print0 | xargs -0 -n1 sh -n

      - name: Validate documentation
        run: python scripts/validate_docs.py

      - name: Validate source fixtures
        run: python scripts/validate_source_fixtures.py

      - name: Validate ransomware.live failure contract
        run: python scripts/test_ransomware_live_contract.py

      - name: Validate RansomLook adapter contract
        run: python scripts/test_ransomlook_contract.py

      - name: Validate FrenchBreaches RSS adapter contract
        run: python scripts/test_frenchbreaches_contract.py

      - name: Validate cross-source correlation contract
        run: python scripts/test_cross_source_correlation_contract.py

      - name: Validate source health and orchestration contract
        run: python scripts/test_source_health_contract.py

      - name: Validate deterministic matching contract
        run: python scripts/test_matching_contract.py

      - name: Validate configurable retention contract
        run: python scripts/test_retention_contract.py

      - name: Validate operational dashboards contract
        run: python scripts/test_operational_dashboards_contract.py

      - name: Validate architecture and threat-model review
        run: python scripts/test_architecture_threat_model_review.py

      - name: Validate exclusive analysis provider routing
        run: python scripts/test_analysis_provider_routing_contract.py

      - name: Validate repository configuration
        run: sh scripts/validate.sh

      - name: Remove ephemeral failure-mode database
        if: always()
        run: docker compose --env-file .env.example down -v
