name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: find scripts infra -type f -name '*.sh' -print0 | xargs -0 -n1 sh -n

      - name: Validate documentation
        run: python scripts/validate_docs.py

      - name: Validate source fixtures
        run: python scripts/validate_source_fixtures.py

      - name: Validate ransomware.live failure contract
        run: python scripts/test_ransomware_live_contract.py

      - name: Validate RansomLook adapter contract
        run: python scripts/test_ransomlook_contract.py

      - name: Validate deterministic matching contract
        run: python scripts/test_matching_contract.py

      - name: Validate repository configuration
        run: sh scripts/validate.sh
