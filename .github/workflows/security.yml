name: Security scanning

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-history:
    name: Secret history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan complete Git history with redacted output
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact=100 --no-banner --no-color --verbose --timeout=300
          --log-opts=--all /repo

  container-images:
    name: Container image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            image: postgres:17.10-alpine3.23
            source_image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
          - name: n8n
            image: docker.n8n.io/n8nio/n8n:2.36.7
            source_image: ghcr.io/n8n-io/n8n:2.36.7@sha256:14c4285bc3034dc5b51034aea393711d27053588e460722bce523453a626f23c
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create report directory
        run: mkdir -p security-reports

      - name: Pull exact image for local scan
        env:
          SOURCE_IMAGE: ${{ matrix.source_image }}
          SCAN_IMAGE: ${{ matrix.image }}
        run: |
          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$SCAN_IMAGE"
          docker image inspect "$SCAN_IMAGE" >/dev/null

      - name: Scan pinned image with Trivy
        run: >-
          docker run --rm
          --volume "$PWD/security-reports:/reports"
          --volume /var/run/docker.sock:/var/run/docker.sock
          ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --skip-version-check --scanners vuln --format json
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          --output /reports/${{ matrix.name }}.json
          ${{ matrix.image }}

      - name: Enforce critical vulnerability threshold
        run: >-
          python scripts/security/evaluate_trivy_report.py
          security-reports/${{ matrix.name }}.json
          security/trivy-exceptions.json

      - name: Upload vulnerability report
        if: ${{ always() && hashFiles(format('security-reports/{0}.json', matrix.name)) != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.name }}
          path: security-reports/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 14
