name: Security scanning

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-history:
    name: Secret history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan complete Git history with redacted output
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact=100 --no-banner --no-color --verbose --timeout=300
          --log-opts=--all /repo

  container-images:
    name: Container image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            image: postgres:17.10-alpine3.23
          - name: n8n
            image: docker.n8n.io/n8nio/n8n:2.36.7
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create report directory
        run: mkdir -p security-reports

      - name: Scan pinned image with Trivy
        run: >-
          docker run --rm
          --volume "$PWD/security-reports:/reports"
          --volume /var/run/docker.sock:/var/run/docker.sock
          ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --skip-version-check --scanners vuln --format json
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          --output /reports/${{ matrix.name }}.json
          ${{ matrix.image }}

      - name: Enforce critical vulnerability threshold
        run: >-
          python scripts/security/evaluate_trivy_report.py
          security-reports/${{ matrix.name }}.json
          security/trivy-exceptions.json

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trivy-${{ matrix.name }}
          path: security-reports/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 14
